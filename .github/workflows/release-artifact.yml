name: Release Artifact

on:
  push:
    tags:
      - '*'

# Least privilege (#1599): read-only by default; the release job raises
# only the scopes its steps use.
permissions:
  contents: read

jobs:
  release:
    # contents: write for `gh release create`; id-token + attestations for
    # actions/attest-build-provenance (runs once the mirror is public).
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Nothing pushes with the checkout token, so keep it out of
          # .git/config, where install and test scripts could read it (#1659).
          persist-credentials: false

      - name: Validate release manifest
        run: |
          python3 - <<'PY'
          import json
          import os
          manifest = json.load(open(".chronary-release.json", "r", encoding="utf-8"))
          if manifest["artifact"] != "openapi":
              raise SystemExit("Expected artifact openapi")
          if manifest["public_tag"] != os.environ["GITHUB_REF_NAME"]:
              raise SystemExit("Tag mismatch between manifest and workflow ref")
          PY
          test -f RELEASE_NOTES.txt

      - name: Validate spec
        run: test -f openapi.json

      - name: Generate checksum
        run: sha256sum openapi.json > openapi.sha256

      - name: Attest build provenance for spec snapshot
        # Free-tier orgs can only attest in PUBLIC repos. Auto-enables on flip.
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: 'openapi.json'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" openapi.json openapi.sha256 \
            --title "chronary-openapi ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.txt
